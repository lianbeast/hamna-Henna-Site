<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#fbf4e7"/>
  <g transform="translate(400,430)">
    <!-- outer petals -->
    <g stroke="#8C2E2A" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M 0,-280 C 60,-280 100,-240 100,-190 C 100,-130 60,-90 0,-80 C -60,-90 -100,-130 -100,-190 C -100,-240 -60,-280 0,-280 Z"/>
      <path d="M 0,-280 C 60,-280 100,-240 100,-190 C 100,-130 60,-90 0,-80 C -60,-90 -100,-130 -100,-190 C -100,-240 -60,-280 0,-280 Z" transform="rotate(40)"/>
      <path d="M 0,-280 C 60,-280 100,-240 100,-190 C 100,-130 60,-90 0,-80 C -60,-90 -100,-130 -100,-190 C -100,-240 -60,-280 0,-280 Z" transform="rotate(-40)"/>
      <path d="M 0,-280 C 60,-280 100,-240 100,-190 C 100,-130 60,-90 0,-80 C -60,-90 -100,-130 -100,-190 C -100,-240 -60,-280 0,-280 Z" transform="rotate(80)"/>
      <path d="M 0,-280 C 60,-280 100,-240 100,-190 C 100,-130 60,-90 0,-80 C -60,-90 -100,-130 -100,-190 C -100,-240 -60,-280 0,-280 Z" transform="rotate(-80)"/>
    </g>
    <!-- mid petals -->
    <g stroke="#C29A4B" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M 0,-220 C 45,-220 75,-185 75,-140 C 75,-90 45,-55 0,-45 C -45,-55 -75,-90 -75,-140 C -75,-185 -45,-220 0,-220 Z"/>
      <path d="M 0,-220 C 45,-220 75,-185 75,-140 C 75,-90 45,-55 0,-45 C -45,-55 -75,-90 -75,-140 C -75,-185 -45,-220 0,-220 Z" transform="rotate(45)"/>
      <path d="M 0,-220 C 45,-220 75,-185 75,-140 C 75,-90 45,-55 0,-45 C -45,-55 -75,-90 -75,-140 C -75,-185 -45,-220 0,-220 Z" transform="rotate(-45)"/>
      <path d="M 0,-220 C 45,-220 75,-185 75,-140 C 75,-90 45,-55 0,-45 C -45,-55 -75,-90 -75,-140 C -75,-185 -45,-220 0,-220 Z" transform="rotate(90)"/>
      <path d="M 0,-220 C 45,-220 75,-185 75,-140 C 75,-90 45,-55 0,-45 C -45,-55 -75,-90 -75,-140 C -75,-185 -45,-220 0,-220 Z" transform="rotate(-90)"/>
    </g>
    <!-- inner lotus -->
    <g stroke="#8C2E2A" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M 0,-150 C 40,-150 65,-115 65,-70 C 65,-20 40,15 0,25 C -40,15 -65,-20 -65,-70 C -65,-115 -40,-150 0,-150 Z"/>
      <path d="M 0,-150 C 40,-150 65,-115 65,-70 C 65,-20 40,15 0,25 C -40,15 -65,-20 -65,-70 C -65,-115 -40,-150 0,-150 Z" transform="rotate(72)"/>
      <path d="M 0,-150 C 40,-150 65,-115 65,-70 C 65,-20 40,15 0,25 C -40,15 -65,-20 -65,-70 C -65,-115 -40,-150 0,-150 Z" transform="rotate(144)"/>
      <path d="M 0,-150 C 40,-150 65,-115 65,-70 C 65,-20 40,15 0,25 C -40,15 -65,-20 -65,-70 C -65,-115 -40,-150 0,-150 Z" transform="rotate(216)"/>
      <path d="M 0,-150 C 40,-150 65,-115 65,-70 C 65,-20 40,15 0,25 C -40,15 -65,-20 -65,-70 C -65,-115 -40,-150 0,-150 Z" transform="rotate(288)"/>
    </g>
    <!-- seed dots -->
    <g fill="#8C2E2A">
      <circle cx="0" cy="-70" r="12"/>
      <circle cx="0" cy="-70" r="12" transform="rotate(72)"/>
      <circle cx="0" cy="-70" r="12" transform="rotate(144)"/>
      <circle cx="0" cy="-70" r="12" transform="rotate(216)"/>
      <circle cx="0" cy="-70" r="12" transform="rotate(288)"/>
    </g>
    <!-- calyx / base leaves -->
    <g stroke="#8C2E2A" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M 0,60 C 70,80 120,140 110,200 C 100,250 55,275 0,265 C -55,275 -100,250 -110,200 C -120,140 -70,80 0,60 Z"/>
      <path d="M 0,60 C 40,120 70,190 60,240" stroke="#C29A4B"/>
      <path d="M 0,60 C -40,120 -70,190 -60,240" stroke="#C29A4B"/>
    </g>
  </g>
</svg>
